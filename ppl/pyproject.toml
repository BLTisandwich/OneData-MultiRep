[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "onedata-omnibench"
version = "0.1.1"
description = "Shared sensory encoders for compact-LLM robot action and grounded QA"
requires-python = ">=3.10,<3.13"
dependencies = [
  "torch==2.7.1", "torchvision==0.22.1", "transformers==5.3.0",
  "peft==0.18.1", "accelerate==1.12.0", "numpy>=1.26,<3", "scipy>=1.11",
  "soundfile>=0.12", "PyYAML>=6", "safetensors>=0.4", "huggingface-hub>=0.34",
  "Pillow>=10", "tokenizers>=0.22"
]
[project.optional-dependencies]
simulation = ["pybullet==3.2.7", "trimesh>=4", "opencv-python-headless>=4.8", "imageio>=2.34", "imageio-ffmpeg>=0.5"]
test = ["pytest>=8"]
[project.scripts]
omnibench = "omnibench.cli:main"
[tool.setuptools.packages.find]
include = ["omnibench*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
